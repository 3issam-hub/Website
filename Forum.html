<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" type="image/x-icon" href="https://raw.githubusercontent.com/3issam-hub/Website/main/assets/favico.png" />
    <link rel="mask-icon" type="image/x-icon" href="https://raw.githubusercontent.com/3issam-hub/Website/main/assets/favico.svg" color="#111" />
    <title>WebSecura Form</title>
    <script src="https://js.hcaptcha.com/1/api.js" async defer></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo-section {
            background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%);
            padding: 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .logo-section::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="2" fill="rgba(255,255,255,0.1)"/></svg>') repeat;
            animation: float 20s linear infinite;
        }

        @keyframes float {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-50px, -50px); }
        }

        .logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(45deg, #3498db, #2980b9);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: white;
            font-weight: bold;
            position: relative;
            z-index: 2;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .logo::before {
            content: '{}';
            font-family: monospace;
        }

        .company-name {
            color: black;
            font-size: 24px;
            font-weight: 600;
            margin-top: 15px;
            position: relative;
            z-index: 2;
        }

        .form-container {
            padding: 40px;
        }

        .form-title {
            color: #2c3e50;
            font-size: 28px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 25px;
            position: relative;
        }

        label {
            display: block;
            color: #2c3e50;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        select, input, textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e6ed;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: white;
            color: #2c3e50;
        }

        select:focus, input:focus, textarea:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
            transform: translateY(-2px);
        }

        select:hover, input:hover, textarea:hover {
            border-color: #3498db;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
            font-family: inherit;
        }

        .captcha-container {
            background: #f8f9fa;
            border: 2px solid #3498db;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            margin-bottom: 25px;
            position: relative;
            overflow: hidden;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .captcha-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(52, 152, 219, 0.1), transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .captcha-placeholder {
            color: #7f8c8d;
            font-style: italic;
            position: relative;
            z-index: 2;
            margin-bottom: 10px;
        }

        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
            color: white;
            padding: 18px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .submit-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .submit-btn:hover:not(:disabled)::before {
            left: 100%;
        }

        .submit-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(52, 152, 219, 0.3);
        }

        .submit-btn:active:not(:disabled) {
            transform: translateY(-1px);
        }

        .social-media-section {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px solid #e0e6ed;
            text-align: center;
        }

        .social-media-section h3 {
            color: #2c3e50;
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .social-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 18px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .social-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .social-btn:hover::before {
            left: 100%;
        }

        .social-btn:hover {
            transform: translateY(-3px);
            text-decoration: none;
            color: white;
        }

        .facebook {
            background: linear-gradient(135deg, #1877f2 0%, #42a5f5 100%);
            box-shadow: 0 4px 15px rgba(24, 119, 242, 0.3);
        }

        .facebook:hover {
            box-shadow: 0 8px 25px rgba(24, 119, 242, 0.5);
        }

        .twitter {
            background: linear-gradient(135deg, #1da1f2 0%, #0d8bf0 100%);
            box-shadow: 0 4px 15px rgba(29, 161, 242, 0.3);
        }

        .twitter:hover {
            box-shadow: 0 8px 25px rgba(29, 161, 242, 0.5);
        }

        .linkedin {
            background: linear-gradient(135deg, #0077b5 0%, #005885 100%);
            box-shadow: 0 4px 15px rgba(0, 119, 181, 0.3);
        }

        .linkedin:hover {
            box-shadow: 0 8px 25px rgba(0, 119, 181, 0.5);
        }

        .github {
            background: linear-gradient(135deg, #333 0%, #24292e 100%);
            box-shadow: 0 4px 15px rgba(51, 51, 51, 0.3);
        }

        .github:hover {
            box-shadow: 0 8px 25px rgba(51, 51, 51, 0.5);
        }

        .forum {
            background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%);
            box-shadow: 0 4px 15px rgba(46, 204, 113, 0.3);
        }

        .forum:hover {
            box-shadow: 0 8px 25px rgba(46, 204, 113, 0.5);
        }

        .form-group.loading select {
            background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%233498db"><circle cx="12" cy="12" r="2"><animate attributeName="r" values="2;6;2" dur="1s" repeatCount="indefinite"/></circle></svg>');
            background-repeat: no-repeat;
            background-position: right 15px center;
            background-size: 20px;
        }

        @media (max-width: 768px) {
            .container {
                margin: 10px;
                border-radius: 10px;
            }
            
            .form-container {
                padding: 25px;
            }
            
            .logo-section {
                padding: 20px;
            }
            
            .social-links {
                flex-direction: column;
                align-items: center;
            }
            
            .social-btn {
                width: 200px;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-section">
            <img src="https://raw.githubusercontent.com/3issam-hub/Website/main/assets/favico.png" alt="WebSecura Logo" style="height: 100px; margin-right: 10px;">
            
        </div>
        
        <div class="form-container">
            <h2 class="form-title">Contact Us</h2>
            
            <form id="contactForm" action="https://api.web3forms.com/submit" method="POST">
                <input type="hidden" name="access_key" value="80af7cd3-34c6-405e-8446-92d88bbcd98f">
                <input type="hidden" name="subject" value="New IT Service Inquiry">
                <input type="hidden" name="from_name" value="TechSolutions Pro Contact Form">
                
                <div class="form-group">
                    <label for="category">Service Category</label>
                    <select id="category" name="category" required>
                        <option value="">Select a category...</option>
                        <option value="Website Creation">Web Development</option>
                        <option value="cybersecurity">Cybersecurity</option>
                        <option value="it-consulting">IT Consulting</option>
                        <option value="Design">Design</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="subcategory">Specific Service</label>
                    <select id="subcategory" name="subcategory" required disabled>
                        <option value="">Select a category first...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required placeholder="your.email@company.com">
                </div>

                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" required placeholder="John Doe">
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" required placeholder="Please describe your project requirements, timeline, and any specific technical needs..."></textarea>
                </div>

                <div class="captcha-container">
                    <div class="captcha-placeholder">Complete the security verification below:</div>
                    <div class="h-captcha" data-sitekey="80af7cd3-34c6-405e-8446-92d88bbcd98f"></div>
                </div>

                <button type="submit" class="submit-btn">
                    Send Message
                </button>
            </form>
            
            <div class="social-media-section">
                <h3>Connect With Us</h3>
                <div class="social-links">
                    <a href="https://facebook.com/your-page" target="_blank" class="social-btn facebook">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                        </svg>
                        Facebook
                    </a>
                    <a href="https://twitter.com/your-handle" target="_blank" class="social-btn twitter">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M23.953 4.57a10 10 0 01-2.825.775 4.958 4.958 0 002.163-2.723c-.951.555-2.005.959-3.127 1.184a4.92 4.92 0 00-8.384 4.482C7.69 8.095 4.067 6.13 1.64 3.162a4.822 4.822 0 00-.666 2.475c0 1.71.87 3.213 2.188 4.096a4.904 4.904 0 01-2.228-.616v.06a4.923 4.923 0 003.946 4.827 4.996 4.996 0 01-2.212.085 4.936 4.936 0 004.604 3.417 9.867 9.867 0 01-6.102 2.105c-.39 0-.779-.023-1.17-.067a13.995 13.995 0 007.557 2.209c9.053 0 13.998-7.496 13.998-13.985 0-.21 0-.42-.015-.63A9.935 9.935 0 0024 4.59z"/>
                        </svg>
                        Twitter
                    </a>
                    <a href="https://linkedin.com/company/your-company" target="_blank" class="social-btn linkedin">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
                        </svg>
                        LinkedIn
                    </a>
                    <a href="https://github.com/your-username" target="_blank" class="social-btn github">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
                        </svg>
                        GitHub
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Web3Forms script -->
    <script src="https://web3forms.com/client/script.js" async defer></script>
    
    <script>
        const categorySubcategories = {
            'Website Creation': [
                'Wordpress Website',
                'Shopify Website',
                'Landing Page',
                'E-commerce Website',
                'CMS Development',
                'Portfolio'
            ],
            'cybersecurity': [
                'Security Audits',
                'Penetration Testing',
                'Vulnerability Assessment',
                'Security Training',
                'Incident Response',
                'Compliance Consulting'
            ],
            'it-consulting': [
                'Technology Strategy',
                'System Architecture',
                'Digital Transformation',
                'IT Infrastructure',
                'Process Optimization',
                'Technology Roadmap'
            ],
            'Design': [
                'Logo & Brand Identity',
                'Social Media Posts & Stories',
                'Flyers & Posters',
                'Business Cards & Stationery',
                'Packaging & Label Design',
                'Website & App Graphics',
                'Presentation Design',
                'Product Mockups',
                'Brochures & Catalogs',
            ],
        };

        const categorySelect = document.getElementById('category');
        const subcategorySelect = document.getElementById('subcategory');

        categorySelect.addEventListener('change', function() {
            const selectedCategory = this.value;
            const subcategoryGroup = subcategorySelect.closest('.form-group');
            
            // Add loading animation
            subcategoryGroup.classList.add('loading');
            
            // Clear previous options
            subcategorySelect.innerHTML = '<option value="">Loading...</option>';
            subcategorySelect.disabled = true;
            
            setTimeout(() => {
                subcategoryGroup.classList.remove('loading');
                
                if (selectedCategory && categorySubcategories[selectedCategory]) {
                    subcategorySelect.innerHTML = '<option value="">Select a service...</option>';
                    
                    categorySubcategories[selectedCategory].forEach(subcategory => {
                        const option = document.createElement('option');
                        option.value = subcategory.toLowerCase().replace(/\s+/g, '-');
                        option.textContent = subcategory;
                        subcategorySelect.appendChild(option);
                    });
                    
                    subcategorySelect.disabled = false;
                } else {
                    subcategorySelect.innerHTML = '<option value="">Select a category first...</option>';
                    subcategorySelect.disabled = true;
                }
            }, 500);
        });

        // Form submission handler with CAPTCHA validation
        document.getElementById('contactForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Check if hCaptcha is completed
            const captchaResponse = hcaptcha.getResponse();
            if (!captchaResponse) {
                alert('Please complete the CAPTCHA verification');
                return;
            }
            
            const submitBtn = document.querySelector('.submit-btn');
            const originalText = submitBtn.textContent;
            
            submitBtn.textContent = 'Sending...';
            submitBtn.disabled = true;
            
            // Create FormData object
            const formData = new FormData(this);
            formData.append('h-captcha-response', captchaResponse);
            
            // Submit the form
            fetch(this.action, {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert('Message sent successfully!');
                    this.reset();
                    hcaptcha.reset();
                    subcategorySelect.disabled = true;
                    subcategorySelect.innerHTML = '<option value="">Select a category first...</option>';
                } else {
                    throw new Error(data.message || 'Failed to send message');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Failed to send message. Please try again.');
            })
            .finally(() => {
                submitBtn.textContent = originalText;
                submitBtn.disabled = false;
            });
        });

        // Add smooth animations to form elements
        const formElements = document.querySelectorAll('input, select, textarea');
        formElements.forEach(element => {
            element.addEventListener('focus', function() {
                this.parentElement.style.transform = 'scale(1.02)';
            });
            
            element.addEventListener('blur', function() {
                this.parentElement.style.transform = 'scale(1)';
            });
        });
    </script>
</body>
</html>
